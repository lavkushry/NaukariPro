<!doctype html>
<html><body>
<form id="application">
  <label>First Name <input name="first_name" required /></label>
  <label>Last Name <input name="last_name" required /></label>
  <label>Email <input name="email" type="email" required /></label>
  <label>Phone <input name="phone" required /></label>
  <label>Resume <input name="resume" type="file" /></label>
  <label>LinkedIn Profile <input name="linkedin" /></label>
  <label>Notice Period <input name="notice_period" placeholder="e.g. 30 days" /></label>
  <label>Current CTC (INR) <input name="current_ctc" /></label>
  <label>Expected CTC (INR) <input name="expected_ctc" /></label>
  <label>Willing to relocate to Bengaluru?
    <select name="willing_to_relocate"><option>Yes</option><option>No</option></select>
  </label>
  <button type="submit">Submit Application</button>
</form>
</body></html>
