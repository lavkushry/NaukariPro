<!doctype html>
<html><body>
<form id="instahyre-app">
  <label>Full Name <input name="full_name" required /></label>
  <label>Email <input name="email" type="email" required /></label>
  <label>Phone <input name="phone" required /></label>
  <label>Notice Period <input name="notice_period" /></label>
  <label>Current CTC <input name="current_ctc" /></label>
  <label>Expected CTC <input name="expected_ctc" /></label>
  <label>Preferred Location
    <select name="preferred_location">
      <option>Bengaluru</option><option>Hyderabad</option><option>Pune</option><option>NCR</option>
    </select>
  </label>
  <button type="submit">Apply</button>
</form>
</body></html>
