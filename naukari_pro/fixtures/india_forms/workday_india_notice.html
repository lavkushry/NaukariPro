<!doctype html>
<html><body>
<form id="workday-app">
  <label>Legal Name <input data-automation-id="legalName" name="legal_name" /></label>
  <label>Email <input data-automation-id="email" name="email" /></label>
  <label>Phone <input data-automation-id="phone" name="phone" /></label>
  <label>Notice Period (days) <input name="notice_period" /></label>
  <label>Current CTC <input name="current_ctc" /></label>
  <!-- Absolute blockers — agent must NEVER fill -->
  <label>Aadhaar Number <input name="aadhaar" data-blocker="government_id" /></label>
  <label>PAN <input name="pan" data-blocker="government_id" /></label>
  <button type="submit">Submit</button>
</form>
</body></html>
