[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    unit: T0 one function/class, no I/O beyond tmp fixtures
    contract: T1 cross-module contract (schema, protocol, exit code)
    integration: T2 several modules over tmp SQLite + fixtures, offline
    e2e_mock: T3 golden journey through mock engine
    property: T4 Hypothesis-generated inputs, invariant-based
    redteam: T5 adversarial input; pass = system rejects/blocks
    chaos: T6 kill/corrupt/disk-full/WAL recovery/resume
    acceptance: T7 Master Prompt §9 acceptance criteria
    scenario: NaukariPro NP-#### scenario suite member
    hammer: Big Hammer Protocol blow (H1–H12 destructive red-team)
